<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>F1C200S 文件</title>
<style>body{font:16px system-ui;margin:0;color:#172329;background:#f3f5f6}main{max-width:850px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ccd4d8;padding-bottom:16px}h1{font-size:24px;margin:0}button,a{color:#087858}button{font:inherit;padding:12px 18px;border:1px solid #b9c8c4;border-radius:4px;background:white;cursor:pointer}section{padding:24px 0}input{max-width:100%}progress{width:100%;margin:20px 0}table{width:100%;border-collapse:collapse}td,th{padding:14px 6px;text-align:left;border-bottom:1px solid #dce2e4;overflow-wrap:anywhere}td:first-child{max-width:450px}#status{min-height:24px;color:#52636c}button:disabled{opacity:.5}</style>
<main><header><h1>F1C200S 文件</h1><button id="refresh">刷新</button></header>
<section><input id="files" type="file" multiple><button id="upload">上传</button><button id="cancel" disabled>取消</button><progress id="progress" value="0" max="100"></progress><div id="status"></div></section>
<table><thead><tr><th>文件名</th><th>大小</th><th></th></tr></thead><tbody id="list"></tbody></table></main>
<script>
const $=id=>document.getElementById(id);let active=null,canceled=false;
async function refresh(){try{const r=await fetch('/api/files',{cache:'no-store'});if(!r.ok)throw Error(r.status);const files=await r.json();$('list').replaceChildren();for(const f of files){const row=document.createElement('tr');for(const text of [f.name,(f.size/1048576).toFixed(2)+' MiB']){const cell=document.createElement('td');cell.textContent=text;row.append(cell)}const cell=document.createElement('td'),link=document.createElement('a');link.href='/files/'+encodeURIComponent(f.name);link.textContent='下载';link.download=f.name;cell.append(link);row.append(cell);$('list').append(row)}}catch(e){$('status').textContent='读取失败：'+e.message}}
$('refresh').onclick=refresh;$('cancel').onclick=()=>{canceled=true;if(active)active.abort()};
$('upload').onclick=async()=>{canceled=false;$('upload').disabled=true;$('cancel').disabled=false;try{for(const file of $('files').files){if(canceled)break;$('status').textContent=file.name;await new Promise((resolve,reject)=>{const x=active=new XMLHttpRequest();x.open('PUT','/api/upload/'+encodeURIComponent(file.name));x.setRequestHeader('X-F1-Upload','1');x.upload.onprogress=e=>{if(e.lengthComputable)$('progress').value=e.loaded*100/e.total};x.onload=()=>x.status===201?resolve():reject(Error(x.status===409?'文件已存在或上传未完成':x.responseText||'上传失败'));x.onerror=()=>reject(Error('连接中断'));x.onabort=()=>reject(Error('已取消'));x.send(file)})}if(!canceled)$('status').textContent='上传完成';await refresh()}catch(e){$('status').textContent=e.message}finally{active=null;$('upload').disabled=false;$('cancel').disabled=true}};refresh();
</script></html>
